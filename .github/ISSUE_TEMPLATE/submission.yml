name: Submit a missing project
description: Found an ARTEX derivative that is not listed? A link is enough.
title: "[2K] add: owner/repo"
labels: ["submission"]
body:
  - type: input
    id: repo
    attributes:
      label: Repository URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Derivative (fork)
        - Backup mirror (mirror)
        - Defensive research (defense)
        - Tooling (tool)
        - Primary distribution (distribution)
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it counts as ARTEX-related
      description: Link to the evidence — a README passage, a commit, a release note, all fine
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed relative to upstream
      description: One sentence is enough, e.g. "new frontend plus a self-hosted model gateway"
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: The repository is public and contains no attack targets, victim information or private data
          required: true
