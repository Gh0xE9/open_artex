name: Correction / removal request
description: Correct an entry, or ask for a listed repository to be removed
title: "[2K] correction: ARTEX-2K-"
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        This site only lists public repositories and their own descriptions. If something is wrong,
        or you represent the project and want it removed, fill in the form below.
        Corrections and removals do not need a PR — a maintainer updates `data/curation.json` or
        `data/exclude.json` after checking.
  - type: dropdown
    id: action
    attributes:
      label: Request type
      options:
        - Correct description / tags / tier
        - Add attribution or an upstream link
        - Removal (repository deleted or made private)
        - Removal (requested by the project)
    validations:
      required: true
  - type: input
    id: cert
    attributes:
      label: Certificate number
      description: Looks like ARTEX-2K-0013, shown at the top of the entry's page
      placeholder: ARTEX-2K-0013
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: What should change
      description: Say exactly which field is wrong and what it should be, with a link we can verify
      placeholder: The description says "secondary development", but this is an official upstream fork — please set the type to distribution…
    validations:
      required: true
  - type: textarea
    id: identity
    attributes:
      label: Identity (removal requests only)
      description: Repository owner account, organisation email, or something verifiable from the repository's commit history
    validations:
      required: false
